services:
  - type: web
    name: hintro-meeting-intelligence
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: google/gemma-4-31b-it:free
      - key: WEBHOOK_URL
        sync: false
